# 앱 전역 설정 — 경로는 sangkwon_app 폴더 기준
data:
  metrics_table: data/metrics_v2_food.parquet        # 상권 지표 (상권 × 월 × 중분류, 2023-01~). 대분류마다 parquet 1개씩 든 폴더 — seoul_sales 모델 노트북 5절
  factor_table: data/factor_v2h_food.csv             # 업종별 요인 결과 (변수 단위) — seoul_sales 모델 노트북 4절 (중분류별 LightGBM + SHAP)
  group_table: data/group_v2h_food.csv               # 업종별 요인 묶음 (요인 카드) — seoul_sales 모델 노트북 4-6
  area_table: data/area.csv                                 # 상권 단위 표 (prep/build_area.py) — 음식점 기준 상권 경계
  area_shapes: data/area_shapes.geojson                     # 상권 경계

# 대분류별 상권 경계. 여기 없는 대분류(음식점·카페·주점)는 위 data.area_table / area_shapes 를 씀.
# 경계가 다른 대분류로 바꾸면 고른 상권을 비움 (같은 번호라도 다른 상권이라서)
area_sets:
  소매:
    area_table: data/area_retail.csv                        # prep/build_area.py --cluster-csv ../data_rent/cluster_retail_t9_202607.csv --suffix _retail
    area_shapes: data/area_shapes_retail.geojson
  서비스:
    area_table: data/area_service.csv                       # prep/build_area.py --cluster-csv ../data_rent/cluster_service_t9_202607.csv --suffix _service
    area_shapes: data/area_shapes_service.geojson

period_months: 12          # 비교 기간: 데이터 마지막 달부터 거꾸로 n개월
baseline_min_stores: 3     # '서울 보통'에 넣을 상권: 같은 업종 가게가 최근 달 n곳 이상
sample_min_stores: 3       # 상권의 같은 업종 가게가 n곳 미만이면 하이라이트 요약을 만들지 않음
highlight_T: 5             # 가장 유리·불리 표시 기준 (매출 %p 환산 차이)
judge_gap_pp: 5            # 생존율 등 '유리/보통/아쉬움' 태그 기준 (%p). 신규 가게 수가 적어 2%p 는 가게 1곳 차이보다 작아서 5 로 올림
grid_area_km2: 0.0625      # 격자 1칸 넓이 (250m × 250m)
max_slots: 3

total_label: 전체          # 중분류 드롭다운의 '전체' 값
total_fallback: aggregate  # 데이터에 '전체' 행이 없을 때: none = 비워둠 / aggregate = 중분류를 합쳐서 계산
default_major: 음식점      # 상권 지표에 대분류 컬럼이 없을 때 쓰는 값
default_middle: 한식

llm_placeholder: LLM 한줄 해석 연결 예정

# 상권 상세 — 트렌드 비교
trend:
  recent_months: 3        # '최근 n개월'
  chart_months: 12        # 추이 그래프 기간
  yoy_min_months: 15      # 데이터가 이 개월 수 이상이면 '최근 n개월 vs 전년 동기'로 자동 전환 (v2 상권 지표는 43개월 → 전년 동기)

# LLM 연결 (키는 OPENUB_API — .env 또는 Streamlit secrets). model 이 비어 있으면 자리 표시 문구를 그대로 보여줌
llm:
  model: gpt-5.6-luna   # API 에 쓰는 모델 ID
  reasoning_effort: low # none·low·medium·high·xhigh·max (한 문장 생성은 low 로 충분). 지우면 모델 기본값(medium)
  base_url: https://api.openai.com/v1
  timeout: 20
