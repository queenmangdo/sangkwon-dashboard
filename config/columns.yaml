# 역할 → 실제 컬럼 이름. 데이터 컬럼 이름이 바뀌면 여기만 고친다. 없는 컬럼은 null.
factor_table:
  major: 대분류
  middle: 중분류
  var: 변수
  name: 변수명
  rank: 순위
  share: 중요도 몫 (%)
  direction: 방향
  effect: 방향 크기 (%)          # 상위 25% vs 하위 25% 예측 매출 차이
  reliability: 신뢰도
  shape: 모양                     # 있으면 우선 사용 (increasing/decreasing/optimum/binary). 중분류마다 SHAP 곡선으로 정함
  threshold: null
  optimum: 최적값                 # 모양이 optimum 일 때 곡선 꼭대기 값
  definition: null
  axis_lo: 눈금 시작              # 좋은 구간 띠 — 눈금 범위 (SHAP 곡선 첫·마지막 구간 값)
  axis_hi: 눈금 끝
  band_lo: 좋은 구간 시작          # 곡선 꼭대기에서 양옆으로, 꼭대기의 절반 아래로 떨어지기 전까지
  band_hi: 좋은 구간 끝

group_table:                      # 요인 카드 = 변수 묶음 (시간대·성별연령·요일·법인·배달·프랜차이즈·주변 가게·도로 …)
  major: 대분류
  middle: 중분류
  group: 묶음                     # config/groups.csv 의 group
  rank: 순위
  share: 중요도 몫 (%)
  relation: 관계 문장              # 숫자 없이 말로 쓴 관계 ("점심보다 저녁 장사 비중이 큰 가게일수록 …")
  rep_var: 대표 변수               # 하이라이트·상세 화면에서 상권 값을 보여 줄 변수 (요인 표의 var)
  reliability: 신뢰도

metrics_table:
  cluster: cluster
  month: year_month
  major: category_lg             # 없으면 settings.default_major
  middle: category_mi
  stores: store_count
  sales: total_amount
  payments: sales_count

area_table:
  cluster: cluster
  name: name
  gu: gu
  grid_count: grid_count
  lat: lat
  lon: lon
